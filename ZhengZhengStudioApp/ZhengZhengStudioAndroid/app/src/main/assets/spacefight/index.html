<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceFight - 太空战斗</title>
    <link rel="icon" href="assets/icon.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <script src="vendor/three.min.js"></script>
    <script src="i18n/i18n.js"></script>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        
        <div id="loading-screen" class="screen">
            <div class="loading-content">
                <div class="logo">
                    <div class="logo-icon" aria-hidden="true"></div>
                    <h1>SPACEFIGHT</h1>
                </div>
                <div class="loading-bar">
                    <div class="loading-progress"></div>
                </div>
                <div class="loading-text">加载中...</div>
            </div>
        </div>
        
        <div id="menu-screen" class="screen hidden">
            <div class="menu-content">
                <div class="logo">
                    <div class="logo-icon" aria-hidden="true"></div>
                    <h1>SPACEFIGHT</h1>
                </div>
                <div class="menu-buttons">
                    <button id="btn-play" class="btn-primary">开始游戏</button>
                    <button id="btn-multiplayer" class="btn-secondary">多人模式</button>
                    <button id="btn-settings" class="btn-secondary">设置</button>
                    <button id="btn-mods" class="btn-secondary">模组中心</button>
                    <button id="btn-quit" class="btn-danger">退出</button>
                </div>
            </div>
        </div>
        
        <div id="hud" class="hud hidden">
            <div class="compass-strip" aria-hidden="true">
                <span></span><span></span><span>N</span><span></span><span></span>
            </div>
            <div class="hud-top">
                <div class="player-info">
                    <div class="health-bar">
                        <span>装甲</span>
                        <div class="health-fill" id="health-fill"></div>
                        <b id="health-value">100</b>
                    </div>
                    <div class="shield-bar">
                        <span>护盾</span>
                        <div class="shield-fill" id="shield-fill"></div>
                        <b id="shield-value">100</b>
                    </div>
                    <div class="energy-bar">
                        <span>能量</span>
                        <div class="energy-fill" id="energy-fill"></div>
                        <b id="energy-value">100</b>
                    </div>
                </div>
                <div class="score-wrap">
                    <span>得分</span>
                    <div class="score-display" id="score-display">0</div>
                </div>
            </div>
            <div class="hud-meta">
                <span>波次 <b id="wave-display">-</b></span>
                <span>房间 <b id="room-display">-</b></span>
                <span>玩家 <b id="players-display">0</b></span>
                <span>延迟 <b id="latency-display">-</b></span>
                <span id="network-status">未连接</span>
            </div>
            <div class="objective-panel" aria-hidden="true">
                <h2>作战目标</h2>
                <p><span class="target-mark"></span> 击毁来袭敌机</p>
                <p><span class="target-mark"></span> 保持护盾在线</p>
            </div>
            <div class="reticle" aria-hidden="true">
                <span class="reticle-center"></span>
                <span class="reticle-left"></span>
                <span class="reticle-right"></span>
            </div>
            <div class="hud-bottom">
                <div class="weapon-selector">
                    <div class="weapon-item active" data-weapon="0">
                        <div class="weapon-key">1</div>
                        <div class="weapon-icon weapon-laser" aria-hidden="true"></div>
                        <div class="weapon-ammo">25/100</div>
                        <div class="weapon-name">脉冲炮</div>
                    </div>
                    <div class="weapon-item" data-weapon="1">
                        <div class="weapon-key">2</div>
                        <div class="weapon-icon weapon-missile" aria-hidden="true"></div>
                        <div class="weapon-ammo">5/20</div>
                        <div class="weapon-name">导弹</div>
                    </div>
                    <div class="weapon-item" data-weapon="2">
                        <div class="weapon-key">3</div>
                        <div class="weapon-icon weapon-plasma" aria-hidden="true"></div>
                        <div class="weapon-ammo">100%</div>
                        <div class="weapon-name">能量冲刺</div>
                    </div>
                </div>
                <div class="controls-hint">
                    <span><b>WASD</b> 移动</span>
                    <span><b>鼠标</b> 瞄准/射击</span>
                    <span><b>空格</b> 冲刺</span>
                    <span><b>1-3</b> 切换武器</span>
                </div>
            </div>
            <div id="network-message" class="network-message hidden"></div>
        </div>
        
        <div id="game-over-screen" class="screen hidden">
            <div class="game-over-content">
                <h2>游戏结束</h2>
                <div class="final-score">得分: <span id="final-score">0</span></div>
                <button id="btn-restart" class="btn-primary">重新开始</button>
                <button id="btn-menu" class="btn-secondary">返回菜单</button>
            </div>
        </div>
        
        <div id="settings-screen" class="screen hidden">
            <div class="settings-content">
                <h2>设置</h2>
                <div class="settings-section">
                    <label>音量</label>
                    <input type="range" id="volume-slider" min="0" max="100" value="70">
                </div>
                <div class="settings-section">
                    <label>难度</label>
                    <select id="difficulty-select">
                        <option value="easy">简单</option>
                        <option value="normal">普通</option>
                        <option value="hard">困难</option>
                    </select>
                </div>
                <div class="settings-section">
                    <label>语言</label>
                    <select id="language-select">
                        <option value="zh-CN">中文</option>
                        <option value="en">English</option>
                        <option value="ja">日本語</option>
                        <option value="ko">한국어</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="es">Español</option>
                        <option value="ru">Русский</option>
                        <option value="pt">Português</option>
                        <option value="ar">العربية</option>
                    </select>
                </div>
                <button id="btn-save-settings" class="btn-primary">保存设置</button>
                <button id="btn-close-settings" class="btn-secondary">关闭</button>
            </div>
        </div>
    </div>
    
    <script src="js/input.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/assets.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/network.js"></script>
    <script src="js/mods.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app-shell.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
